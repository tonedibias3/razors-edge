name: Refresh and publish

on:
  schedule:
    # Tue, Wed, Thu and Sat around 7am Eastern. Stats post after Monday night's game and betting lines for the next week follow.
    - cron: "17 11 * * 2,3,4,6"
  workflow_dispatch:        # lets you press "Run workflow" by hand
  push:
    branches: [main]        # also rebuilds when you upload a new salary file or change the code

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r requirements.txt
      - name: Download data, rebuild projections and the page
        run: python pipeline/run_all.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build            # if the build or the safety check fails, the old site stays up
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
