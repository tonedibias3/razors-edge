name: Refresh and publish

on:
  schedule:
    # Every day around 7am Eastern (stats post after Monday night's game, and lines move all week)
    - cron: "17 11 * * *"
    # and again early afternoon Eastern, to catch the lines that move during the day (4 odds credits per run, about 240 a month of the free 500)
    - cron: "17 17 * * *"
  workflow_dispatch:        # lets you press "Run workflow" by hand
  push:
    branches: [main]        # also rebuilds when you upload a new salary file or change the code

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r requirements.txt
      - name: Keep finished college seasons between runs (saves free API calls)
        uses: actions/cache@v4
        with:
          path: work/cfb_cache
          key: cfb-history-v1-${{ github.run_id }}
          restore-keys: cfb-history-v1-
      - name: Keep the saved line history between runs (also stops pushes from spending odds credits)
        uses: actions/cache@v4
        with:
          path: work/odds_cache
          key: odds-history-v1-${{ github.run_id }}
          restore-keys: odds-history-v1-
      - name: Download data, rebuild projections and the page
        run: python pipeline/run_all.py
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build            # if the build or the safety check fails, the old site stays up
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
